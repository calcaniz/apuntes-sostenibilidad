<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Detectives de ODS · A03.01</title>
<style>
:root{
  --principal:#ff9944; --secundario:#81501c; --claro:#fdf4e9; --borde:#d9c9b6;

  --sel:#1565c0;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto);background:#fff;font-size:15px;line-height:1.45}
header{background:var(--secundario);color:#fff;padding:8px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
header .prog{font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.puntos{background:var(--principal);color:#2b1a05;font-weight:700;border-radius:99px;padding:2px 10px}
.barra{width:140px;height:8px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--principal);width:0;transition:width .3s}
.aviso{background:#fff3cd;border-bottom:1px solid #e0b100;color:#5a4300;padding:5px 14px;font-size:13px}
main{padding:12px;max-width:1280px;margin:0 auto}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.tabs button{font:inherit;font-size:13.5px;border:1px solid var(--borde);background:#f6eee2;color:var(--secundario);padding:6px 10px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--secundario);color:#fff;border-color:var(--secundario);font-weight:600}
.tabs button .c{font-size:12px;opacity:.85}
.intro{background:var(--claro);border-left:4px solid var(--principal);padding:8px 12px;border-radius:4px;margin:0 0 12px;font-size:14px}
.intro p{margin:0 0 6px}.intro p:last-child{margin:0}
.btn{font:inherit;border:1px solid #b9ad9f;background:#fff;border-radius:6px;padding:5px 12px;cursor:pointer;color:var(--texto)}
.btn:hover{background:#f8f1e8}
.btn.pri{background:var(--principal);border-color:var(--secundario);font-weight:700;color:#2b1a05}
.btn.mini{font-size:12.5px;padding:2px 8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.acc{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.fb{margin-top:8px;font-size:13.5px;border-radius:6px;padding:7px 10px}
.fb.ok{background:var(--okbg);color:#1b5e20;border:1px solid var(--ok)}
.fb.ko{background:var(--kobg);color:#7a1a14;border:1px solid var(--ko)}
.fb.neutro{background:#f4f4f4;border:1px solid #ccc}
.pista{margin-top:8px;font-size:13.5px;background:#fff8e1;border:1px solid #e0b100;border-radius:6px;padding:7px 10px}
label.lbl{display:block;font-weight:600;margin:10px 0 4px}
input[type=text],textarea,select{font:inherit;padding:6px 8px;border:1px solid #b9ad9f;border-radius:6px;width:100%;max-width:520px;background:#fff;color:var(--texto)}
textarea{max-width:100%;min-height:70px;resize:vertical}
.cnt{font-size:12px;color:var(--gris)}
/* Preguntas */
.preg{border:1px solid var(--borde);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.preg.ok{border-color:var(--ok);background:#fafdf9}.preg.ko{border-color:var(--ko);background:#fffafa}
.preg h3{margin:0 0 8px;font-size:14.5px}
.ops{display:flex;flex-direction:column;gap:5px}
.ops button{font:inherit;text-align:left;border:1px solid var(--borde);background:#fff;border-radius:6px;padding:6px 10px;cursor:pointer}
.ops button:hover:not(:disabled){background:#f8f1e8}
.ops button:disabled{cursor:default;color:var(--texto)}
.ops button.elegida.bien{background:var(--okbg);border-color:var(--ok);font-weight:600}
.ops button.elegida.mal{background:var(--kobg);border-color:var(--ko);font-weight:600}
/* Expediente */
.exp{display:grid;grid-template-columns:minmax(300px,1fr) minmax(300px,440px);gap:14px;align-items:start}
@media (max-width:900px){.exp{grid-template-columns:1fr}}
.ev{border:1px solid var(--borde);border-radius:8px;padding:9px 11px;margin-bottom:9px;cursor:pointer;background:#fff;transition:box-shadow .15s}
.ev:hover{box-shadow:0 1px 6px rgba(0,0,0,.08)}
.ev.sel{outline:3px solid var(--sel);outline-offset:1px}
.ev.ok{border-color:var(--ok);background:#fafdf9;cursor:default}
.ev .cab{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--gris);margin-bottom:3px}
.ev .txt{font-size:14.5px}
.chip{display:inline-block;color:#fff;font-weight:700;border-radius:4px;padding:1px 7px;font-size:12.5px;margin-right:4px}
.tablero{position:sticky;top:8px;border:1px solid var(--borde);border-radius:8px;overflow:hidden}
@media (max-width:900px){.tablero{position:static}}
.tablero h2{margin:0;padding:6px 10px;font-size:13px;font-weight:600;background:var(--claro);color:var(--secundario);border-bottom:1px solid var(--borde)}
.tablero .ayuda{font-size:12.5px;color:var(--gris);padding:6px 10px 0}
.metas{display:flex;flex-direction:column;gap:5px;padding:8px 10px 10px;max-height:78vh;overflow:auto}
.meta{display:flex;gap:8px;align-items:center;border:0;border-radius:6px;padding:6px 8px;cursor:pointer;color:#fff;font:inherit;font-size:13px;text-align:left;line-height:1.3}
.meta b{font-size:14px;min-width:38px}
.meta:disabled{opacity:.55;cursor:not-allowed}
.meta:hover:not(:disabled){filter:brightness(1.08);box-shadow:0 0 0 2px #fff inset}
/* Greenwashing */
.decl{border:1px solid var(--borde);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.decl.ok{border-color:var(--ok);background:#fafdf9}
.decl blockquote{margin:0 0 8px;padding:6px 10px;border-left:4px solid #3f7e44;background:#f3f8f1;font-size:14.5px}
.opc{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.opc label{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--borde);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:13.5px;background:#fff}
.opc label:has(input:checked){background:#f6eee2;border-color:var(--secundario);font-weight:600}
.motivos{margin-top:8px}
.motivos select{max-width:420px}
/* Matriz */
.prio{display:grid;grid-template-columns:1fr minmax(280px,360px);gap:14px;align-items:start}
@media (max-width:900px){.prio{grid-template-columns:1fr}}
.bandeja{display:flex;flex-wrap:wrap;gap:6px;min-height:40px;padding:8px;border:1px dashed var(--borde);border-radius:8px;margin-bottom:10px}
.ods{border:0;color:#fff;font:inherit;font-weight:700;font-size:13px;border-radius:6px;padding:5px 9px;cursor:pointer}
.ods.sel{outline:3px solid var(--sel);outline-offset:2px}
.ods.elegido::after{content:" ★"}
table.matriz{border-collapse:separate;border-spacing:4px;width:100%}
table.matriz th{font-size:12.5px;color:var(--secundario);font-weight:600;padding:2px}
table.matriz td{border:1px dashed var(--borde);border-radius:8px;vertical-align:top;height:86px;padding:5px;cursor:pointer;background:#fffdfa}
table.matriz td:hover{background:#fdf4e9}
table.matriz td .dec{display:block;font-size:11.5px;color:var(--gris);margin-bottom:4px}
table.matriz td .ods{margin:2px}
.just{border:1px solid var(--borde);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.codigo-exp{font-family:Consolas,Menlo,monospace;font-size:18px;font-weight:700;letter-spacing:1px;background:#1f1b16;color:#ffd4a8;border-radius:6px;padding:8px 12px;display:inline-block;margin:6px 0}
table.res{border-collapse:collapse;width:100%;font-size:13.5px;margin:8px 0}
table.res th,table.res td{border-bottom:1px solid #eee;padding:4px 6px;text-align:left}
table.res th{color:var(--secundario)}
.nombre-pdf{font-family:Consolas,Menlo,monospace;background:#f4f4f4;border:1px solid #ccc;border-radius:6px;padding:6px 10px;margin:6px 0;word-break:break-all;font-size:13.5px}
.miembros{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;max-width:760px}
</style>
</head>

  {id:"equipo",t:"0. Equipo"},{id:"billete",t:"1. Billete de entrada"},{id:"expediente",t:"2. Expediente FestWeb"},
  {id:"greenwashing",t:"3. Caza del greenwashing"},{id:"prioridades",t:"4. Prioridades"},{id:"informe",t:"5. Informe"}
];

/* ================= Estado ================= */
const CLAVE="sasp-a0301-v1";
let memoria=null, stoOk=true;
function vacio(){return {grupo:"",miembros:["","","","",""],billete:{},exp:{},decl:{},reescritura:"",prio:{pos:{},elegidos:[],just:{}},indiv:{},persona:""};}
function cargar(){
  if(memoria)return memoria;
  try{const s=localStorage.getItem(CLAVE); memoria=s?Object.assign(vacio(),JSON.parse(s)):vacio();}
  catch(e){stoOk=false; memoria=vacio();}
  return memoria;
}
function guardar(){try{localStorage.setItem(CLAVE,JSON.stringify(memoria));}catch(e){stoOk=false;} document.getElementById("avisoSto").hidden=stoOk;}
function upd(f){f(cargar()); guardar(); cabecera();}

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const chip=id=>{const m=META[id]; return '<span class="chip" style="background:'+COLOR[m.ods]+'">'+id+'</span>';};
const odsBtn=(n,extra)=>'<button class="ods'+(extra||"")+'" data-ods="'+n+'" style="background:'+COLOR[n]+'" title="ODS '+n+' · '+esc(NOMBRE_ODS[n])+'">ODS '+n+'</button>';
function ahora(){const d=new Date(),p=n=>String(n).padStart(2,"0"); return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes());}

let pestana="equipo", evSel=null, odsSel=null;

/* ================= Puntuación y progreso ================= */
function ptsEvid(e){if(!e||!e.ok)return 0; let p=Math.max(10-4*(e.n-1),2); if(e.pista)p=Math.ceil(p/2); return p;}
function prioCompleta(o){return o.prio.elegidos.length===3 && o.prio.elegidos.every(n=>o.prio.pos[n]) && incoherencias(o).length===0 && o.prio.elegidos.every(n=>(o.prio.just[n]||"").trim().length>=40);}
function puntos(o){
  let p=0;
  BILLETE.forEach(q=>{const r=o.billete[q.id]; if(r!=null&&r===q.c)p+=2;});
  EVID.forEach(e=>p+=ptsEvid(o.exp[e.id]));
  DECL.forEach(d=>{const r=o.decl[d.id]; if(r&&r.ok)p+=r.n===1?5:2;});
  if(prioCompleta(o))p+=10;
  return p;
}
function progreso(o){
  const tot=BILLETE.length+EVID.length+DECL.length+1;
  const h=BILLETE.filter(q=>o.billete[q.id]!=null).length+EVID.filter(e=>o.exp[e.id]&&o.exp[e.id].ok).length+DECL.filter(d=>o.decl[d.id]&&o.decl[d.id].ok).length+(prioCompleta(o)?1:0);
  return {h,tot};
}
function cabecera(){
  const o=cargar(), pr=progreso(o);
  $("puntos").textContent=puntos(o)+" puntos";
  $("progTxt").textContent=pr.h+" de "+pr.tot+" tareas";
  $("progBar").style.width=Math.round(100*pr.h/pr.tot)+"%";
  $("avisoSto").hidden=stoOk;
}
function cuentaTab(id,o){
  if(id==="billete")return BILLETE.filter(q=>o.billete[q.id]!=null).length+"/"+BILLETE.length;
  if(id==="expediente")return EVID.filter(e=>o.exp[e.id]&&o.exp[e.id].ok).length+"/"+EVID.length;
  if(id==="greenwashing")return DECL.filter(d=>o.decl[d.id]&&o.decl[d.id].ok).length+"/"+DECL.length;
  if(id==="prioridades")return prioCompleta(o)?"✔":"";
  if(id==="equipo")return miembros(o).length?miembros(o).length+" pers.":"";
  return "";
}
const miembros=o=>o.miembros.map(s=>s.trim()).filter(Boolean);

/* ================= Pintado ================= */
function pintar(){
  const o=cargar();
  $("tabs").innerHTML=PESTANAS.map(p=>{const c=cuentaTab(p.id,o); return '<button role="tab" data-tab="'+p.id+'" aria-selected="'+(p.id===pestana)+'">'+p.t+(c?' <span class="c">('+c+')</span>':"")+'</button>';}).join("");
  ({equipo:pEquipo,billete:pBillete,expediente:pExpediente,greenwashing:pGreen,prioridades:pPrio,informe:pInforme})[pestana](o);
  cabecera();
}

function comprobarEvid(idEv,idMeta){
  const e=EVID.find(x=>x.id===idEv);
  upd(o=>{
    const s=o.exp[idEv]||(o.exp[idEv]={n:0,ok:false,resp:"",ultima:"",pista:false,fb:""});
    if(s.ok)return;
    s.n++; s.ultima=idMeta;
    if(e.ok.includes(idMeta)){s.ok=true; s.resp=idMeta; s.fb="";}
    else s.fb="Meta "+idMeta+": "+(e.near[idMeta]||GEN);
  });

  pintar();
}

function comprobarDecl(id){
  const d=DECL.find(x=>x.id===id), o=cargar(), s=o.decl[id]||{};
  if(!s.tipo){o.decl[id]=Object.assign(s,{fb:"Elegid primero si la frase está justificada o es greenwashing."}); guardar(); pintar(); return;}
  if(s.tipo==="gw"&&!s.motivo){s.fb="Indicad también qué le falta o qué hace mal."; guardar(); pintar(); return;}
  upd(o=>{
    const s=o.decl[id]; s.n=(s.n||0)+1;
    if(d.gw){
      if(s.tipo==="ok")s.fb="Revisadla de nuevo: ¿hay algún dato, método o acción concreta que respalde lo que afirma?";
      else if(s.motivo!==d.m)s.fb="Sí es greenwashing, pero el problema principal es otro. Fijaos en qué parte de la frase no se puede comprobar.";
      else{s.ok=true; s.fb="";}
    }else{
      if(s.tipo==="gw")s.fb="Esta frase aporta datos o compromisos comprobables. ¿Qué le faltaría para ser greenwashing?";
      else{s.ok=true; s.fb="";}
    }
  });
  pintar();
}

function incoherencias(o){
  const P=o.prio, out=[];
  P.elegidos.forEach(n=>{const c=P.pos[n]; if(c&&c[0]==="B")out.push("Habéis priorizado el ODS "+n+", pero lo habéis valorado con importancia baja.");});
  P.elegidos.forEach(n=>{
    const c=P.pos[n]; if(!c)return;
    ODS_PRIO.forEach(m=>{const cm=P.pos[m]; if(!P.elegidos.includes(m)&&cm&&RANGO[cm]<RANGO[c])out.push("Habéis dejado fuera el ODS "+m+" ("+NNIVEL[cm[0]].toLowerCase()+" importancia, viabilidad "+NNIVEL[cm[1]].toLowerCase()+"), que vosotros mismos valoráis mejor que el ODS "+n+".");});
  });
  return out;
}
function codigoExp(o){
  if(o.prio.elegidos.length!==3)return null;
  const e=o.prio.elegidos.slice().sort((a,b)=>a-b);
  return "A0301-"+e.map(n=>String(n).padStart(2,"0")).join("-")+"-"+hash(e.join(",")+"|"+o.grupo.trim().toLowerCase()).slice(0,4);
}

  h+='</div><div>';

  const inc=incoherencias(o);
  if(P.elegidos.length===3){
    if(inc.length)h+='<div class="fb ko"><b>Revisad la coherencia con vuestra propia matriz:</b><br>'+inc.map(esc).join("<br>")+'</div>';
    else if(!P.elegidos.every(n=>(P.just[n]||"").trim().length>=40))h+='<div class="fb neutro">La matriz es coherente. Completad las tres justificaciones.</div>';
    else h+='<div class="fb ok">Prioridades coherentes y justificadas. Guardad el código de expediente: lo necesitaréis en la A03.03.<br><span class="codigo-exp">'+esc(codigoExp(o))+'</span></div>';
  }
  h+='</div></div>';

function clicCelda(c){
  if(!odsSel)return;
  upd(o=>{if(c){o.prio.pos[odsSel]=c;} else {delete o.prio.pos[odsSel]; o.prio.elegidos=o.prio.elegidos.filter(n=>n!==odsSel);}});
  odsSel=null; pintar();
}
function clicOds(n){
  odsSel=(odsSel===n)?null:n; pintar();
}
function estrella(n){
  upd(o=>{const E=o.prio.elegidos; if(E.includes(n))o.prio.elegidos=E.filter(x=>x!==n); else if(E.length<3)E.push(n);});
  odsSel=null; pintar();
}

function cp1252(s){
  const map={"—":"\x97","–":"\x96","“":"\x93","”":"\x94","‘":"\x91","’":"\x92","•":"\x95","…":"\x85","€":"\x80","→":"->","✔":"[x]","★":"*","«":"\xab","»":"\xbb"};
  s=String(s).normalize("NFC"); let out="";
  for(const ch of s){
    const c=ch.codePointAt(0);
    if(Object.prototype.hasOwnProperty.call(map,ch))out+=map[ch];
    else if(c<32)out+=" ";
    else if(c<127||(c>=160&&c<256))out+=ch;
    else out+="?";
  }
  return out;
}
function pdfEsc(s){return s.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");}
function envolver(texto,size,sangria){
  const max=Math.floor(495/(0.53*size))-(sangria||0), pal=cp1252(texto).split(" "), l=[]; let act="";
  pal.forEach(w=>{
    while(w.length>max){if(act){l.push(act);act="";} l.push(w.slice(0,max)); w=w.slice(max);}
    if((act+" "+w).trim().length>max){l.push(act);act=w;} else act=(act?act+" ":"")+w;
  });
  l.push(act); return l;
}
function construyePDF(lineas){
  const pags=[[]]; let y=792; const M=50;
  lineas.forEach(L=>{
    const size=L.s||10, lh=size*1.45, sang=L.i||0, fuente=L.b?"F2":"F1";
    const partes=L.t===""?[""]:envolver(L.t,size,sang);
    partes.forEach(txt=>{
      if(y-lh<M){pags.push([]); y=792;}
      y-=lh;
      pags[pags.length-1].push("BT /"+fuente+" "+size+" Tf "+(M+sang*size*0.53).toFixed(1)+" "+y.toFixed(1)+" Td ("+pdfEsc(txt)+") Tj ET");
    });
  });
  const n=pags.length, total=4+n*2;
  const lista=[null,"<< /Type /Catalog /Pages 2 0 R >>",null,
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"];
  const kids=[];
  pags.forEach((p,i)=>{
    const idc=5+i*2, idp=6+i*2, cont=p.join("\n");
    lista[idc]="<< /Length "+cont.length+" >>\nstream\n"+cont+"\nendstream";
    lista[idp]="<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+idc+" 0 R >>";
    kids.push(idp+" 0 R");
  });
  lista[2]="<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+n+" >>";
  let pdf="%PDF-1.4\n"; const offs=[];
  for(let k=1;k<=total;k++){offs[k]=pdf.length; pdf+=k+" 0 obj\n"+lista[k]+"\nendobj\n";}
  const xref=pdf.length;
  pdf+="xref\n0 "+(total+1)+"\n0000000000 65535 f \n";
  for(let q=1;q<=total;q++)pdf+=("0000000000"+offs[q]).slice(-10)+" 00000 n \n";
  pdf+="trailer\n<< /Size "+(total+1)+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";
  const bytes=new Uint8Array(pdf.length);
  for(let b=0;b<pdf.length;b++)bytes[b]=pdf.charCodeAt(b)&255;
  return bytes;
}
function hash(s){let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return ("00000000"+(h>>>0).toString(16)).slice(-8).toUpperCase();}
function informe(o,per){
  const L=[], canon=[];
  const t=(x,s,b,i)=>{L.push({t:x,s:s,b:b,i:i}); canon.push(x);};
  t("A03.01 · Detectives de ODS en FestWeb",14,true);
  t("Sostenibilidad Aplicada al Sistema Productivo · UP03",10); t("");
  t("Informe de: "+per,11,true);
  t("Consultora (grupo): "+(o.grupo.trim()||"(sin nombre)"),10);
  t("Integrantes: "+miembros(o).join(", "),10);
  t("Fecha del informe: "+ahora(),10);
  const pr=progreso(o);
  t("Tareas completadas: "+pr.h+" de "+pr.tot+"   ·   Puntos del equipo: "+puntos(o),10); t("");

  t("1. Billete de entrada ("+BILLETE.filter(q=>o.billete[q.id]===q.c).length+"/"+BILLETE.length+" aciertos)",11,true);
  BILLETE.forEach((q,i)=>{const r=o.billete[q.id]; t((i+1)+". "+q.p,10,false,1); t(r==null?"(sin responder)":(r===q.c?"[x] ":"[ ] ")+q.o[r],9,false,4);});
  t("");
  t("2. Expediente FestWeb ("+EVID.filter(e=>o.exp[e.id]&&o.exp[e.id].ok).length+"/"+EVID.length+" evidencias)",11,true);
  EVID.forEach((e,i)=>{
    const s=o.exp[e.id]||{n:0};
    t("Evidencia "+(i+1)+": "+e.t,10,false,1);
    t(s.ok?"[x] Meta "+s.resp+" · "+META[s.resp].t+" — "+s.n+" intento"+(s.n===1?"":"s")+(s.pista?", con pista":"")
          :"[ ] Pendiente"+(s.n?" — "+s.n+" intento"+(s.n===1?"":"s")+", último: meta "+s.ultima+(s.pista?", con pista":""):""),9,false,4);
  });
  t("");
  t("3. Caza del greenwashing ("+DECL.filter(d=>o.decl[d.id]&&o.decl[d.id].ok).length+"/"+DECL.length+" frases)",11,true);
  DECL.forEach(d=>{
    const s=o.decl[d.id]||{n:0};
    t("«"+d.t+"»",10,false,1);
    t(s.ok?"[x] "+(d.gw?"Greenwashing: "+MOTIVOS.find(m=>m.id===d.m).t:"Justificada")+" — "+s.n+" intento"+(s.n===1?"":"s"):"[ ] Pendiente"+(s.n?" — "+s.n+" intentos":""),9,false,4);
  });
  t("Reescritura del grupo:",10,true,1);
  t((o.reescritura||"").trim()||"(sin respuesta)",10,false,4);
  t("");
  t("4. Prioridades",11,true);
  ODS_PRIO.forEach(n=>{const c=o.prio.pos[n]; t("ODS "+n+" · "+NOMBRE_ODS[n]+": "+(c?"importancia "+NNIVEL[c[0]].toLowerCase()+", viabilidad "+NNIVEL[c[1]].toLowerCase():"sin situar")+(o.prio.elegidos.includes(n)?"  [PRIORITARIO]":""),9,false,1);});
  t("Justificación de los ODS prioritarios:",10,true,1);
  if(!o.prio.elegidos.length)t("(sin ODS prioritarios)",10,false,4);
  o.prio.elegidos.forEach(n=>{t("ODS "+n+": "+((o.prio.just[n]||"").trim()||"(sin justificación)"),10,false,4);});
  const inc=incoherencias(o); if(inc.length)t("Incoherencias pendientes: "+inc.join(" "),9,false,1);
  t("Código de expediente para la A03.03: "+(codigoExp(o)||"(pendiente)"),10,true,1);
  t("");
  t("5. Respuesta individual de "+per,11,true);
  t("¿Con qué ODS priorizado estás más de acuerdo y con cuál menos? ¿Por qué?",10,false,1);
  t((o.indiv[per]||"").trim(),10,false,1);
  t("");
  t("Código de comprobación: "+hash(canon.join("|")),9,true);
  return L;
}
function descargar(){
  const o=cargar(), per=o.persona, f=nombrePDF(per); if(!f)return;
  const blob=new Blob([construyePDF(informe(o,per))],{type:"application/pdf"}), url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=f; document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a); URL.revokeObjectURL(url);},500);
  $("fbInf").innerHTML='<div class="fb ok">Informe descargado como <code>'+esc(f)+'</code>. Súbelo a Aules. Si hay más personas en el grupo, que seleccionen ahora su nombre.</div>';
}

/* ================= Eventos ================= */
document.addEventListener("click",ev=>{
  const el=ev.target.closest("button,[data-ev],[data-celda]"); if(!el)return;
  const d=el.dataset;
  if(d.tab){pestana=d.tab; evSel=null; odsSel=null; pintar(); window.scrollTo(0,0); return;}
  if(d.ir){pestana=d.ir; pintar(); window.scrollTo(0,0); return;}
  if(d.bil){const q=BILLETE.find(x=>x.id===d.bil); if(cargar().billete[q.id]==null){upd(o=>{o.billete[q.id]=Number(d.op);}); pintar();} return;}
  if(d.ev){const s=cargar().exp[d.ev]; if(s&&s.ok)return; evSel=d.ev; pintar(); return;}
  if(d.meta){if(evSel)comprobarEvid(evSel,d.meta); return;}
  if(d.pista){upd(o=>{o.exp[d.pista].pista=true;}); pintar(); return;}
  if(d.dcomp){comprobarDecl(d.dcomp); return;}
  if(d.estrella){estrella(Number(d.estrella)); return;}
  if(d.desel){odsSel=null; pintar(); return;}
  if(d.ods){
    const n=Number(d.ods);
    if(odsSel&&odsSel!==n&&el.closest("[data-celda]")){clicCelda(el.closest("[data-celda]").dataset.celda); return;}
    clicOds(n); return;
  }
  if(d.celda!==undefined&&el.tagName!=="BUTTON"){clicCelda(d.celda); return;}
  if(el.id==="btnPdf"){descargar(); return;}
  if(el.id==="btnReiniciar"){
    if(d.seguro){memoria=vacio(); guardar(); evSel=null; odsSel=null; pestana="equipo"; pintar();}
    else{d.seguro="1"; el.textContent="Pulsa otra vez para confirmar: se borrará todo";}
  }
});
document.addEventListener("input",ev=>{
  const el=ev.target, d=el.dataset;
  if(d.campo){upd(o=>{o[d.campo]=el.value;}); if(d.campo==="reescritura"){const c=el.nextElementSibling; if(c)c.textContent=el.value.trim().length+" caracteres (mínimo 60)";} return;}
  if(d.miembro!==undefined){upd(o=>{o.miembros[Number(d.miembro)]=el.value;}); return;}
  if(d.just){upd(o=>{o.prio.just[d.just]=el.value;}); const c=el.nextElementSibling; if(c)c.textContent=el.value.trim().length+" caracteres (mínimo 40)"; return;}
  if(el.id==="inIndiv"){const o=cargar(); upd(x=>{x.indiv[o.persona]=el.value;}); $("cntIndiv").textContent=el.value.trim().length+" caracteres (mínimo 80)";
    const b=$("btnPdf"); if(b)b.disabled=!(nombrePDF(o.persona)&&el.value.trim().length>=80); return;}
});
document.addEventListener("change",ev=>{
  const el=ev.target, d=el.dataset;
  if(d.dtipo){upd(o=>{const s=o.decl[d.dtipo]||(o.decl[d.dtipo]={n:0,ok:false}); s.tipo=el.value; s.fb=""; if(el.value==="ok")s.motivo="";}); $("mot-"+d.dtipo).hidden=el.value!=="gw"; return;}
  if(d.dmot){upd(o=>{const s=o.decl[d.dmot]||(o.decl[d.dmot]={n:0,ok:false}); s.motivo=el.value;}); return;}
  if(el.id==="selPersona"){upd(o=>{o.persona=el.value;}); pintar(); return;}
  if(d.just||d.campo==="reescritura"){pintar();}
});

cargar(); pintar();
