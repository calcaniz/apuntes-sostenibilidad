site_name: Sostenibilidad Aplicada al Sistema Productivo
site_description: Apuntes del módulo de Sostenibilidad de 2.º DAW
site_author: Carlos Alcañiz Carbonell

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Activar modo oscuro
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Activar modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Inicio: index.md
  - UP01. Introducción a la sostenibilidad:
      - Presentación: up01/index.md
      - Introducción: up01/01-introduccion.md
      - Desarrollo sostenible: up01/02-desarrollo-sostenible.md
      - Agenda 2030: up01/03-agenda-2030.md
      - Objetivos de Desarrollo Sostenible: up01/04-ods.md
      - Grupos de interés y materialidad: up01/07-grupos-de-interes-y-materialidad.md