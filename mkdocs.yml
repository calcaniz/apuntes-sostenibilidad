site_name: Sostenibilidad Aplicada al Sistema Productivo
site_description: Apuntes del módulo de Sostenibilidad de 2.º DAW
site_author: Carlos Alcañiz Carbonell

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: orange
      accent: light green
      toggle:
        icon: material/weather-night
        name: Activar modo oscuro
    - scheme: slate
      primary: orange
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Activar modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

copyright: >
  © 2026-2027 Carlos Alcañiz ·
  Sostenibilidad Aplicada al Sistema Productivo

extra:
  generator: false
  
extra_css:
  - assets/stylesheets/extra.css

nav:
  - Inicio: index.md
  - UP01. Sostenibilidad, Agenda 2030 y criterios ASG:
      - 1. Relación Curricular: up01/01-index.md
      - 2. Introducción: up01/02-introduccion.md
      - 3. Sostenibilidad y desarrollo sostenible: up01/03-sostenibilidad-y-desarrollo-sostenible.md
      - 4. Marcos internacionales para el desarrollo sostenible: up01/04-marcos-internacionales-para-el-desarrollo-sostenible.md
      - 5. Los criterios ASG: up01/05-criterios-asg.md
      - 6. Grupos de interés y materialidad: up01/06-grupos-de-interes-y-materialidad.md